services:
  - type: web
    name: erp-sc-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm exec tsc -p packages/permissions/tsconfig.json && pnpm --filter @erp/api build
    startCommand: pnpm --filter @erp/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
      - key: APP_BASE_URL
        value: https://erp-sc-web.onrender.com

  - type: web
    name: erp-sc-web
    runtime: static
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @erp/web build
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /verify-email
        destination: /verify-email.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://erp-sc-api.onrender.com/api/v1
